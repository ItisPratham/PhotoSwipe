name: PhotoSwipe

# NOTE: PhotoSwipe.xcodeproj is committed and Xcode-managed — it is the
# authoritative project; this spec is kept in sync as a readable description
# of the same targets. It is validated by generating into a scratch directory
# (`xcodegen generate --spec project.yml --project /tmp/somewhere`), never by
# regenerating over the committed project.

# Non-compiled files surfaced in the Xcode navigator (repo-root docs/config).
fileGroups:
  - PhotoSwipe_Instructions.md
  - README.md
  - project.yml
  - .gitignore

options:
  bundleIdPrefix: com.phototinder
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "6.1"
    CURRENT_PROJECT_VERSION: "1"
    # Accelerate's CBLAS (duplicate matching) without the deprecated headers.
    OTHER_SWIFT_FLAGS: "-Xcc -DACCELERATE_NEW_LAPACK"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_LANGUAGE: en
    DEVELOPMENT_TEAM: TT7LR66US3

packages:
  DMScrollBar:
    url: https://github.com/batanus/DMScrollBar.git
    revision: 52b662428629e659c18c7641d76ee4a8d495a1de

targets:
  PhotoSwipe:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PhotoSwipe
        # Git-ignored, optional Core ML artifacts. They are compiled into the
        # bundle by the build phase below when installed, so a checkout
        # without them still builds.
        excludes:
          - "Resources/*.mlpackage"
          - "Resources/mobileclip-provenance.json"
          - "Resources/siglip2-provenance.json"
          - "Resources/siglip2-vocab.json"
    postBuildScripts:
      - name: Compile installed Core ML models
        runOnlyWhenInstalling: false
        script: |
          if [ "$ACTION" = "clean" ]; then exit 0; fi
          resources="$SRCROOT/PhotoSwipe/Resources"
          destination="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          mkdir -p "$destination"
          for name in FaceEmbedding MobileCLIPS2Image MobileCLIPS2Text SigLIP2Image SigLIP2Text; do
            package="$resources/$name.mlpackage"
            if [ -d "$package" ]; then
              xcrun coremlcompiler compile "$package" "$destination" || exit 1
            else
              echo "note: $name.mlpackage is not installed; the feature it backs stays gated off."
            fi
          done
          for file in mobileclip-provenance.json siglip2-provenance.json siglip2-vocab.json; do
            if [ -f "$resources/$file" ]; then cp "$resources/$file" "$destination/"; fi
          done
    dependencies:
      - package: DMScrollBar
      - target: PhotoSwipeWidget
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: PhotoSwipe/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: PhotoSwipe/Resources/PhotoSwipe.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.phototinder.PhotoSwipe
        PRODUCT_NAME: PhotoSwipe
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES

  PhotoSwipeWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PhotoSwipeWidget
      # Shared with the app: the summary the widget reads and the deep-link
      # values it opens. Nothing else crosses the target boundary.
      - path: PhotoSwipe/Models/CleanupSummary.swift
      - path: PhotoSwipe/Models/CleanRequest.swift
    settings:
      base:
        INFOPLIST_FILE: PhotoSwipeWidget/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: PhotoSwipe
        CODE_SIGN_ENTITLEMENTS: PhotoSwipeWidget/PhotoSwipeWidget.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.phototinder.PhotoSwipe.Widget
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"

  PhotoSwipeTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PhotoSwipeTests
        # Parity fixtures are produced by the converter and git-ignored; the
        # tracked tokenizer vectors next to them are not.
        excludes:
          - "Fixtures/MobileCLIP"
          - "Fixtures/SigLIP2"
    dependencies:
      - target: PhotoSwipe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phototinder.PhotoSwipeTests
        GENERATE_INFOPLIST_FILE: YES
