name: PhotoSwipe

# NOTE: PhotoSwipe.xcodeproj is committed and Xcode-managed — it is the
# authoritative project. This spec is kept in sync as documentation of the
# target layout; regenerating from it would drop the manually added model
# packages and pull in git-ignored test fixtures.

# Non-compiled files surfaced in the Xcode navigator (repo-root docs/config).
fileGroups:
  - PhotoSwipe_Instructions.md
  - README.md
  - project.yml
  - .gitignore

options:
  bundleIdPrefix: com.phototinder
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "6.1"
    CURRENT_PROJECT_VERSION: "1"
    # Accelerate's CBLAS (duplicate matching) without the deprecated headers.
    OTHER_SWIFT_FLAGS: "-Xcc -DACCELERATE_NEW_LAPACK"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_LANGUAGE: en
    DEVELOPMENT_TEAM: TT7LR66US3

packages:
  DMScrollBar:
    url: https://github.com/batanus/DMScrollBar.git
    revision: 52b662428629e659c18c7641d76ee4a8d495a1de

targets:
  PhotoSwipe:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PhotoSwipe
    dependencies:
      - package: DMScrollBar
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: PhotoSwipe/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: PhotoSwipe/Resources/PhotoSwipe.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.phototinder.PhotoSwipe
        PRODUCT_NAME: PhotoSwipe
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES

  PhotoSwipeTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PhotoSwipeTests
    dependencies:
      - target: PhotoSwipe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phototinder.PhotoSwipeTests
        GENERATE_INFOPLIST_FILE: YES
